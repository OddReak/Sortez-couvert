<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Premium Soft Silver) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Ocean Day (Radial for 3D sphere volume) -->
    <radialGradient id="oceanDay" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Ocean Night (Deep space feel) -->
    <radialGradient id="oceanNight" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Stylized Landmass Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Glassy Volume Shadow / Atmosphere Highlight -->
    <!-- Creates the 3D marble/sphere effect over the whole globe -->
    <radialGradient id="globeVolume" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity="0.15"/>
    </filter>
    
    <!-- Clip Path for Night Side Landmasses -->
    <clipPath id="nightClip">
       <!-- Curved terminator line matching the night ocean path -->
       <path d="M 512 182 A 130 330 0 0 0 512 842 A 330 330 0 0 0 512 182 Z"/>
    </clipPath>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)"/>
  
  <!-- Outer Time Scrubbing Dial (Volumetric Glass/Metal) -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.9" filter="url(#dropShadow)"/>
  <circle cx="512" cy="512" r="410" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.8"/>
  
  <!-- Dial tick marks (Hour indicators) -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="#94a3b8" stroke-width="8" stroke-dasharray="2 105.2" opacity="0.6"/>
  
  <!-- Active time indicator (Knob with depth) -->
  <g filter="url(#dropShadow)">
    <circle cx="512" cy="102" r="32" fill="#ffffff"/>
    <circle cx="512" cy="102" r="14" fill="#0ea5e9"/>
  </g>

  <!-- The 3D Stylized Globe -->
  <g filter="url(#dropShadow)">
    <!-- Base Ocean (Day Side) -->
    <circle cx="512" cy="512" r="330" fill="url(#oceanDay)"/>
    
    <!-- Day Landmasses (Stylized, smooth vector blobs) -->
    <path d="M 260 400 C 330 370, 410 430, 420 520 C 430 610, 360 690, 290 650 C 220 610, 190 440, 260 400 Z" fill="url(#landGrad)" opacity="0.9"/>
    <path d="M 440 280 C 480 260, 530 300, 510 380 C 490 430, 420 390, 440 280 Z" fill="url(#landGrad)" opacity="0.9"/>

    <!-- Night Side Ocean -->
    <!-- Creates a 3D curving terminator line mapping over the sphere -->
    <path d="M 512 182 A 130 330 0 0 0 512 842 A 330 330 0 0 0 512 182 Z" fill="url(#oceanNight)"/>

    <!-- Night Landmasses (Dark, clipped to the night curve) -->
    <g clip-path="url(#nightClip)">
       <path d="M 540 370 C 630 330, 730 440, 700 560 C 670 680, 580 620, 550 500 C 520 380, 480 410, 540 370 Z" fill="#0f172a" opacity="0.8"/>
       
       <!-- City Lights Glowing in the dark -->
       <circle cx="590" cy="450" r="3.5" fill="#facc15" filter="url(#glow)"/>
       <circle cx="635" cy="485" r="2.5" fill="#facc15" filter="url(#glow)"/>
       <circle cx="610" cy="530" r="4.5" fill="#facc15" filter="url(#glow)"/>
       <circle cx="670" cy="565" r="2" fill="#facc15" filter="url(#glow)"/>
       <circle cx="575" cy="590" r="3" fill="#facc15" filter="url(#glow)"/>
       <circle cx="650" cy="420" r="2.5" fill="#facc15" filter="url(#glow)"/>
    </g>
    
    <!-- Atmospheric Scatter / Twilight Line -->
    <!-- Adds a glowing sunset/sunrise border exactly on the terminator curve -->
    <path d="M 512 182 A 130 330 0 0 0 512 842" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.6" filter="url(#glow)"/>

    <!-- Stylized Volumetric Clouds -->
    <!-- Smooth semi-transparent white bands wrapping the globe -->
    <path d="M 250 480 Q 370 440 440 500 Q 520 460 610 520" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
    <path d="M 380 700 Q 480 650 580 720" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.25" filter="url(#glow)"/>
    <path d="M 480 270 Q 550 230 620 290" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.2"/>

    <!-- 3D Glassy Volume Overlay -->
    <!-- This gives the entire globe its shiny, spherical dimension -->
    <circle cx="512" cy="512" r="330" fill="url(#globeVolume)"/>
    
    <!-- Thin glowing atmospheric rim on the edge -->
    <circle cx="512" cy="512" r="330" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Extraterrestrial Elements (Sun & Moon inside the track, outside the globe) -->
  <!-- Glowing Sun -->
  <circle cx="160" cy="350" r="28" fill="#facc15" filter="url(#strongGlow)"/>
  
  <!-- Crisp Moon -->
  <path d="M 820 330 A 24 24 0 1 0 865 375 A 32 32 0 0 1 820 330 Z" fill="#f8fafc" filter="url(#glow)"/>
  <circle cx="850" cy="340" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="810" cy="390" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
