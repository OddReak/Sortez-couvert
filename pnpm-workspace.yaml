# pnpm gère ce fichier (protection chaîne d'appro. + scripts de build).
# minimumReleaseAgeExclude : versions autorisées immédiatement malgré le
# délai de quarantaine par défaut de pnpm — ajouté automatiquement à l'install.

allowBuilds:
  msw: false
  sharp: true

# `@vite-pwa/assets-generator` épingle sharp 0.33 (libheif — GHSA high, mais
# build-only, image de source maîtrisée). On force une version corrigée.
overrides:
  sharp: '>=0.35.4'
  '@img/sharp-libvips-linux-x64': '>=1.2.3'

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
