name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests unitaires + couverture
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: 'Budget JS initial (§12, < 180 ko gzip)'
        run: node scripts/check-bundle-budget.mjs dist

      - name: Aucun secret ni appel Foreca direct dans le bundle client
        run: |
          if grep -rEn 'FORECA_API_KEY|VITE_[A-Z0-9_]*(KEY|SECRET|TOKEN)|weatherapi\.foreca\.net' dist ; then
            echo "::error::Secret ou appel Foreca direct détecté dans dist/"
            exit 1
          fi
          echo "OK — aucun secret détecté dans le bundle client"

      - name: Analyse du bundle (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-stats
          path: stats.html
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright · iPhone 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer WebKit + Chromium
        run: pnpm exec playwright install --with-deps webkit chromium
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # Bloquant depuis la Phase 8 : perf / a11y / best-practices ≥ 0.95 (§12/§13).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build RÉEL (service worker + manifest ; pas de MSW) — l'écran d'entrée
      # est représentatif du premier chargement d'un vrai utilisateur.
      - run: pnpm build
      - name: Lighthouse
        # Le runner ubuntu-latest fournit Google Chrome (chrome-launcher le trouve).
        run: pnpm dlx @lhci/cli@0.15.x autorun

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
